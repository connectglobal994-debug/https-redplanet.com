<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Red Planet · Trading Connections Desk</title><style>
:root{color-scheme:dark;--bg:#09070a;--panel:#171117;--line:#40202a;--red:#f12b42;--muted:#b9aeb4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff8fa;font:15px/1.6 Inter,system-ui,sans-serif}.wrap{width:min(1120px,92%);margin:40px auto}.panel,.item{padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--panel);margin:14px 0}.muted{color:var(--muted)}button,select,textarea{padding:10px;border-radius:8px;border:1px solid var(--line);background:#09070a;color:white}button{background:var(--red);cursor:pointer;font-weight:700}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.item textarea{width:100%;min-height:75px;margin:8px 0}.item select{min-width:160px}.error{color:#ff8e9c}.success{color:#9fe4b0}.item h2{margin:8px 0}
</style></head><body><main class="wrap"><p class="muted">RED PLANET · INTERNAL OPERATIONS</p><h1>Trading connections desk</h1><section id="gate" class="panel">Checking staff access…</section><section id="queue"></section></main>
<script src="supabase-config.js"></script><script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2";
const cfg=window.RP_SUPABASE_CONFIG||{},db=createClient(cfg.url,cfg.anonKey),gate=document.getElementById("gate"),queue=document.getElementById("queue");
const esc=v=>String(v??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]));
let user,roles=[];
async function init(){
 const{data:{user:u},error}=await db.auth.getUser();user=u;
 if(error||!user){gate.innerHTML='Please <a href="account.html">sign in</a> with a staff account.';return;}
 const{data,error:roleError}=await db.from("user_roles").select("role").eq("user_id",user.id);if(roleError)throw roleError;
 roles=(data||[]).map(x=>x.role);
 if(!roles.some(x=>["administrator","editor","moderator"].includes(x))){gate.textContent="Access denied. Staff review permission is required.";return;}
 gate.textContent="Authorized reviewer: "+user.email+(roles.includes("administrator")?" · Administrator":" · Reviewer");
 const refresh=document.createElement("button");refresh.textContent="Refresh queue";refresh.onclick=load;gate.append(refresh);await load();
}
async function load(){
 queue.textContent="Loading connection requests…";
 const{data,error}=await db.from("trading_connection_requests").select("id,user_id,provider,broker_name,broker_server,requested_environment,notes,status,staff_notes,assigned_to,created_at").order("created_at",{ascending:true}).limit(100);
 if(error){queue.textContent=error.message;return;}
 queue.replaceChildren();
 if(!data?.length){queue.textContent="No trading connection requests.";return;}
 for(const item of data){
  const el=document.createElement("article");el.className="item";
  const heading=document.createElement("h2");heading.textContent=item.broker_name;el.append(heading);
  const details=document.createElement("p");details.className="muted";details.textContent=[item.provider.toUpperCase(),item.requested_environment,"User "+item.user_id,item.broker_server||"Server not supplied",new Date(item.created_at).toLocaleString()].join(" · ");el.append(details);
  const notes=document.createElement("p");notes.textContent=item.notes||"No additional notes.";el.append(notes);
  const status=document.createElement("select");for(const value of ["pending","in_review","action_required","connected","rejected","cancelled"]){const option=document.createElement("option");option.value=value;option.textContent=value.replaceAll("_"," ");status.append(option);}status.value=item.status;
  if(!roles.includes("administrator"))status.querySelector('option[value="connected"]').disabled=true;
  const assigned=document.createElement("input");assigned.placeholder="Assigned staff UUID (optional)";assigned.value=item.assigned_to||"";assigned.style.flex="1";assigned.style.minWidth="230px";
  const staffNotes=document.createElement("textarea");staffNotes.placeholder="Internal review notes";staffNotes.value=item.staff_notes||"";
  const row=document.createElement("div");row.className="row";row.append(status,assigned);el.append(row,staffNotes);
  const save=document.createElement("button");save.textContent="Save review";const result=document.createElement("span");result.className="muted";
  save.onclick=async()=>{save.disabled=true;const payload={status:status.value,staff_notes:staffNotes.value.trim()||null,assigned_to:assigned.value.trim()||null};const{error:saveError}=await db.from("trading_connection_requests").update(payload).eq("id",item.id);result.textContent=saveError?"Could not save: "+saveError.message:"Review saved.";result.className=saveError?"error":"success";save.disabled=false;};
  const footer=document.createElement("div");footer.className="row";footer.append(save,result);el.append(footer);queue.append(el);
 }
}
init().catch(error=>gate.textContent=error.message||"Could not load trading review desk.");
</script></body></html>
