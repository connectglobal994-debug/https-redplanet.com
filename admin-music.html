<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Red Planet · Music Review Desk</title><style>
:root{color-scheme:dark;--bg:#09070a;--panel:#171117;--line:#40202a;--red:#f12b42;--muted:#b9aeb4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff8fa;font:15px/1.6 Inter,system-ui,sans-serif}.wrap{width:min(1100px,92%);margin:45px auto}.panel,.item{padding:22px;border:1px solid var(--line);border-radius:14px;background:var(--panel);margin:14px 0}h1{font-size:clamp(30px,5vw,48px);margin:8px 0}.muted{color:var(--muted)}button{padding:10px 15px;border:0;border-radius:8px;background:var(--red);color:white;font-weight:800;cursor:pointer;margin:5px}button.secondary{background:#33212a;border:1px solid var(--line)}button:disabled{opacity:.5}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.status{padding:4px 9px;border-radius:99px;background:#35131e;color:#ff9aa6;font-size:12px}.error{color:#ff8e9c}.success{color:#9fe4b0}audio{width:100%;max-width:600px}pre{white-space:pre-wrap;overflow-wrap:anywhere}
</style></head><body><main class="wrap"><p class="muted">RED PLANET · INTERNAL OPERATIONS</p><h1>Music review desk</h1><p class="muted">Review artist submissions, listen to private masters and make a recorded decision. Only authorized editors, moderators and administrators can enter.</p><section id="gate" class="panel">Checking administrator access…</section><section id="queue"></section></main>
<script src="supabase-config.js"></script><script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2";
const cfg=window.RP_SUPABASE_CONFIG||{};const db=createClient(cfg.url,cfg.anonKey);
const gate=document.getElementById("gate"),queue=document.getElementById("queue");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function init(){
 const{data:{user},error}=await db.auth.getUser();
 if(error||!user){gate.innerHTML='Please <a href="account.html">sign in</a> with your Red Planet staff account.';return;}
 const{data:roles,error:roleError}=await db.from("user_roles").select("role").eq("user_id",user.id);
 if(roleError)throw roleError;
 const roleSet=new Set((roles||[]).map(x=>x.role));if(![...roleSet].some(x=>["administrator","moderator","editor"].includes(x))){gate.textContent="Access denied. This account does not have music-review permissions.";return;}
 window.rpCanPublish=roleSet.has("administrator")||roleSet.has("editor");
 gate.innerHTML='<strong class="success">Authorized reviewer</strong><p class="muted">'+esc(user.email)+'</p><button id="refresh">Refresh queue</button>';
 document.getElementById("refresh").onclick=loadQueue;await loadQueue();
}
async function loadQueue(){
 queue.textContent="Loading pending submissions…";
 const{data,error}=await db.from("music_submissions").select("id,title,submission_type,status,description,audio_object_path,artwork_object_path,contributor_credits,submitted_at,artist_profile_id,artist_profiles(artist_name,owner_user_id)").in("status",["submitted","needs_changes","rights_review"]).order("submitted_at",{ascending:true});
 if(error){queue.innerHTML='<p class="error">'+esc(error.message)+'</p>';return;}
 queue.innerHTML="";
 if(!data?.length){queue.innerHTML='<section class="panel">No submissions awaiting review.</section>';return;}
 for(const item of data){
  const el=document.createElement("article");el.className="item";
  el.innerHTML='<div class="row"><span class="status">'+esc(item.status)+'</span><span class="muted">'+esc(item.submission_type)+'</span></div><h2>'+esc(item.title)+'</h2><p>Artist: '+esc(item.artist_profiles?.artist_name)+' · Submitted: '+esc(item.submitted_at||"date unavailable")+'</p><p class="muted">'+esc(item.description||"No additional description")+'</p><p class="muted">Credits: '+esc(JSON.stringify(item.contributor_credits||[]))+'</p><div class="audio muted">Loading private audio preview…</div><div class="field"><label>Approved public audio master (required to publish)</label><input class="delivery-file" type="file" accept="audio/*"></div><label class="muted">Reviewer notes (required when requesting changes or rejecting)<textarea class="review-notes" rows="3" style="display:block;width:100%;margin:8px 0;padding:10px;background:#09070a;color:white;border:1px solid #40202a;border-radius:8px"></textarea></label><div class="row"><button data-action="publish">Publish release</button><button class="secondary" data-action="needs_changes">Request changes</button><button class="secondary" data-action="rejected">Reject</button></div><p class="muted result" aria-live="polite"></p>';
  const publishButton=el.querySelector('button[data-action="publish"]');if(!window.rpCanPublish)publishButton.hidden=true;
  const audioBox=el.querySelector(".audio");
  const{data:file,error:fileError}=await db.storage.from("rp-music-private").createSignedUrl(item.audio_object_path,300);
  if(fileError)audioBox.textContent="Audio preview unavailable: "+fileError.message;
  else audioBox.innerHTML='<audio controls preload="none" src="'+esc(file.signedUrl)+'"></audio>';
  el.querySelectorAll("button[data-action]").forEach(btn=>btn.addEventListener("click",async()=>{
   if(!confirm((btn.dataset.action==="publish"?"Publish approved release: ":"Record decision: ")+item.title+"?"))return;
   const reviewerNotes=el.querySelector(".review-notes").value.trim();if(["needs_changes","rejected"].includes(btn.dataset.action)&&!reviewerNotes){const result=el.querySelector(".result");result.textContent="Add a clear reviewer note before requesting changes or rejecting.";result.className="result error";return;}
   btn.disabled=true;const result=el.querySelector(".result");
   if(btn.dataset.action==="publish"){
    const publicFile=el.querySelector(".delivery-file").files?.[0];
    if(!publicFile){result.textContent="Choose the final approved audio master first.";result.className="result error";btn.disabled=false;return;}
    if(publicFile.size>100*1024*1024){result.textContent="Public master must be 100 MB or smaller.";result.className="result error";btn.disabled=false;return;}
    const ext=(publicFile.name.split(".").pop()||"mp3").toLowerCase().replace(/[^a-z0-9]/g,"");
    const deliveryPath="releases/"+crypto.randomUUID()+"."+ext;
    const{error:uploadError}=await db.storage.from("rp-music-public").upload(deliveryPath,publicFile,{upsert:false,contentType:publicFile.type||"audio/mpeg"});
    if(uploadError){result.textContent=uploadError.message;result.className="result error";btn.disabled=false;return;}
    const releaseType=["ep","album"].includes(item.submission_type)?item.submission_type:"single";
    const slug=(item.title+"-"+item.id.slice(0,8)).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
    const{data:release,error:releaseError}=await db.from("releases").insert({submission_id:item.id,artist_profile_id:item.artist_profile_id,slug,title:item.title,release_type:releaseType,release_date:new Date().toISOString().slice(0,10),published:false}).select("id").single();
    if(releaseError){await db.storage.from("rp-music-public").remove([deliveryPath]);result.textContent="Release creation failed; uploaded audio was cleaned up: "+releaseError.message;result.className="result error";btn.disabled=false;return;}
    const{error:trackError}=await db.from("tracks").insert({release_id:release.id,title:item.title,track_number:1,audio_delivery_path:deliveryPath});
    if(trackError){await db.from("releases").delete().eq("id",release.id);await db.storage.from("rp-music-public").remove([deliveryPath]);result.textContent="Track setup failed; partial release and audio were cleaned up: "+trackError.message;result.className="result error";btn.disabled=false;return;}
    const{error:markError}=await db.from("music_submissions").update({status:"published",reviewed_at:new Date().toISOString(),reviewed_by:user.id}).eq("id",item.id);
    if(markError){await db.from("tracks").delete().eq("release_id",release.id);await db.from("releases").delete().eq("id",release.id);await db.storage.from("rp-music-public").remove([deliveryPath]);result.textContent="Submission update failed; publication was rolled back: "+markError.message;result.className="result error";btn.disabled=false;return;}
    const{error:publishError}=await db.from("releases").update({published:true,published_at:new Date().toISOString()}).eq("id",release.id);
    if(publishError){await db.from("music_submissions").update({status:"approved",reviewed_at:new Date().toISOString(),reviewed_by:user.id}).eq("id",item.id);await db.from("tracks").delete().eq("release_id",release.id);await db.from("releases").delete().eq("id",release.id);await db.storage.from("rp-music-public").remove([deliveryPath]);result.textContent="Could not publish release; publication was rolled back: "+publishError.message;result.className="result error";btn.disabled=false;return;}
   }else{
    const{error:updateError}=await db.from("music_submissions").update({status:btn.dataset.action,review_notes:reviewerNotes,reviewed_at:new Date().toISOString(),reviewed_by:user.id}).eq("id",item.id);
    if(updateError){result.textContent=updateError.message;result.className="result error";btn.disabled=false;return;}
   }
   result.textContent=btn.dataset.action==="publish"?"Release published to the public catalogue.":"Decision saved.";result.className="result success";el.remove();
  }));
  queue.append(el);
 }
}
init().catch(e=>{gate.innerHTML='<p class="error">'+esc(e.message)+'</p>';});
</script></body></html>
