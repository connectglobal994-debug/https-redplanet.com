<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Red Planet TV · Editorial Desk</title><style>:root{color-scheme:dark;--bg:#09070a;--panel:#171117;--line:#40202a;--red:#f12b42;--muted:#b9aeb4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff8fa;font:15px/1.6 Inter,system-ui,sans-serif}.wrap{width:min(1100px,92%);margin:40px auto}.panel,.item{padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--panel);margin:14px 0}.muted{color:var(--muted)}input,textarea,select,button{display:block;width:100%;padding:11px;margin:7px 0 13px;border:1px solid var(--line);border-radius:8px;background:#09070a;color:white}textarea{min-height:130px}button{background:var(--red);font-weight:800;cursor:pointer}.row{display:flex;gap:10px}.row>*{flex:1}.error{color:#ff8e9c}.success{color:#9fe4b0}a{color:#ff8e9c}</style></head><body><main class="wrap"><p class="muted">RED PLANET · TV / NEWSROOM</p><h1>Editorial desk</h1><section id="gate" class="panel">Checking staff access…</section><section id="composer" class="panel" hidden><h2>Create a story</h2><form id="article-form"><label>Headline<input name="title" required minlength="5" maxlength="180"></label><label>Category<select name="category" required><option value="music">Music</option><option value="red_planet">Red Planet</option><option value="collaborations">Collaborations</option><option value="football">Football</option><option value="world">World</option><option value="technology">Technology</option><option value="culture">Culture</option></select></label><label>Summary<textarea name="summary" required minlength="20" maxlength="500"></textarea></label><label>Full story<textarea name="body" required minlength="50" maxlength="30000"></textarea></label><label>Source / publisher<input name="source_name" maxlength="180"></label><label>Original source URL<input name="source_url" type="url" maxlength="1000"></label><button type="submit">Save draft</button><p id="form-status" class="muted" role="status"></p></form></section><section><h2>Stories & review queue</h2><div id="queue"></div></section></main><script src="supabase-config.js"></script><script type="module">import{createClient}from"https://esm.sh/@supabase/supabase-js@2";const c=window.RP_SUPABASE_CONFIG||{},db=createClient(c.url,c.anonKey),gate=document.getElementById("gate"),queue=document.getElementById("queue"),composer=document.getElementById("composer"),form=document.getElementById("article-form"),esc=v=>String(v??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]));let user,roles=[];const slugify=t=>t.toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,140);async function init(){const{data:{user:u},error}=await db.auth.getUser();user=u;if(error||!user){gate.innerHTML='Sign in with a staff account via <a href="account.html">Account</a>.';return;}const{data,error:roleError}=await db.from("user_roles").select("role").eq("user_id",user.id);if(roleError)throw roleError;roles=(data||[]).map(x=>x.role);if(!roles.some(x=>["administrator","editor","moderator"].includes(x))){gate.textContent="Access denied.";return;}gate.textContent="Authorized newsroom user: "+user.email;if(roles.some(x=>["administrator","editor"].includes(x)))composer.hidden=false;await load();}async function load(){const{data,error}=await db.from("tv_articles").select("id,title,category,summary,status,source_name,source_url,editorial_notes,created_at,author_id").order("created_at",{ascending:false}).limit(100);if(error){queue.textContent=error.message;return;}queue.innerHTML="";for(const a of data||[]){const el=document.createElement("article");el.className="item";el.innerHTML='<small class="muted">'+esc(a.category)+' · '+esc(a.status)+' · '+new Date(a.created_at).toLocaleString()+'</small><h3>'+esc(a.title)+'</h3><p>'+esc(a.summary)+'</p>'+(a.source_url?'<p><a href="'+esc(a.source_url)+'" target="_blank" rel="noopener">Original source</a> · '+esc(a.source_name||"")+'</p>':"")+'<label>Editorial notes<textarea class="notes">'+esc(a.editorial_notes||"")+'</textarea></label><div class="row"><select class="state"><option value="draft">Draft</option><option value="in_review">In review</option><option value="needs_changes">Needs changes</option><option value="approved">Approved</option><option value="published">Published</option><option value="rejected">Rejected</option></select><button>Save review</button></div><p class="result muted" role="status"></p>';const sel=el.querySelector("select"),notes=el.querySelector("textarea"),btn=el.querySelector("button"),result=el.querySelector(".result");sel.value=a.status;if(!roles.some(x=>["administrator","editor"].includes(x)))sel.querySelector('option[value="published"]').disabled=true;btn.onclick=async()=>{btn.disabled=true;const status=sel.value,now=new Date().toISOString(),update={status,editorial_notes:notes.value.trim()||null,reviewer_id:user.id,updated_at:now};if(status==="published")update.published_at=now;const{error:saveError}=await db.from("tv_articles").update(update).eq("id",a.id);result.textContent=saveError?"Could not save: "+saveError.message:"Editorial status saved.";result.className="result "+(saveError?"error":"success");btn.disabled=false;};queue.append(el);}}form.addEventListener("submit",async e=>{e.preventDefault();const values=Object.fromEntries(new FormData(form).entries()),button=form.querySelector("button");button.disabled=true;const slug=slugify(values.title)+"-"+crypto.randomUUID().slice(0,8);const{error}=await db.from("tv_articles").insert({...values,slug,author_id:user.id,status:"draft"});document.getElementById("form-status").textContent=error?"Could not save: "+error.message:"Draft saved.";if(!error){form.reset();await load();}button.disabled=false;});init().catch(e=>gate.textContent=e.message);</script></body></html>
