<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Red Planet · Collaboration Desk</title><style>:root{color-scheme:dark;--bg:#09070a;--panel:#171117;--line:#40202a;--red:#f12b42;--muted:#b9aeb4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff8fa;font:15px/1.6 Inter,system-ui,sans-serif}.wrap{width:min(1100px,92%);margin:40px auto}.panel,.item{padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--panel);margin:14px 0}.muted{color:var(--muted)}button,select,textarea{padding:10px;border-radius:8px;border:1px solid var(--line);background:#09070a;color:white}button{background:var(--red);cursor:pointer;font-weight:700}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.item textarea{width:100%;min-height:75px;margin:8px 0}.error{color:#ff8e9c}.success{color:#9fe4b0}</style></head><body><main class="wrap"><p class="muted">RED PLANET · INTERNAL OPERATIONS</p><h1>Collaboration review desk</h1><section id="gate" class="panel">Checking staff access…</section><section id="queue"></section></main><script src="supabase-config.js"></script><script type="module">import{createClient}from"https://esm.sh/@supabase/supabase-js@2";const c=window.RP_SUPABASE_CONFIG||{},db=createClient(c.url,c.anonKey),gate=document.getElementById("gate"),queue=document.getElementById("queue"),esc=v=>String(v??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]));let user;async function init(){const{data:{user:u},error}=await db.auth.getUser();user=u;if(error||!user){gate.innerHTML='Please <a href="account.html">sign in</a> with a staff account.';return;}const{data:roles,error:roleError}=await db.from("user_roles").select("role").eq("user_id",user.id);if(roleError)throw roleError;if(!(roles||[]).some(x=>["administrator","editor","moderator"].includes(x.role))){gate.textContent="Access denied. Staff review permission is required.";return;}gate.innerHTML='<b>Authorized reviewer</b><p class="muted">'+esc(user.email)+'</p><button id="refresh">Refresh queue</button>';document.getElementById("refresh").onclick=load;await load();}async function load(){queue.textContent="Loading enquiries…";const{data,error}=await db.from("collaboration_inquiries").select("id,contact_name,organization,email,inquiry_type,subject,message,status,staff_notes,created_at").order("created_at",{ascending:true}).limit(100);if(error){queue.textContent=error.message;return;}queue.innerHTML="";if(!data?.length){queue.textContent="No collaboration enquiries.";return;}for(const item of data){const el=document.createElement("article");el.className="item";el.innerHTML='<div class="muted">'+esc(item.inquiry_type)+' · '+esc(item.status)+' · '+new Date(item.created_at).toLocaleString()+'</div><h2>'+esc(item.subject)+'</h2><p><b>'+esc(item.contact_name)+'</b> · '+esc(item.organization||"Independent")+' · <a href="mailto:'+encodeURIComponent(item.email)+'">'+esc(item.email)+'</a></p><p>'+esc(item.message)+'</p><label>Internal notes<textarea class="notes">'+esc(item.staff_notes||"")+'</textarea></label><div class="row"><select class="status"><option value="new">New</option><option value="reviewing">Reviewing</option><option value="awaiting_reply">Awaiting reply</option><option value="in_discussion">In discussion</option><option value="accepted">Accepted</option><option value="declined">Declined</option><option value="closed">Closed</option></select><button>Save review</button><span class="muted result" role="status"></span></div>';const sel=el.querySelector("select"),notes=el.querySelector("textarea"),btn=el.querySelector("button"),result=el.querySelector(".result");sel.value=item.status;btn.onclick=async()=>{btn.disabled=true;const now=new Date().toISOString(),{error:saveError}=await db.from("collaboration_inquiries").update({status:sel.value,staff_notes:notes.value.trim()||null,reviewed_at:now,reviewed_by:user.id,updated_at:now}).eq("id",item.id);result.textContent=saveError?"Could not save: "+saveError.message:"Review saved.";result.className="result "+(saveError?"error":"success");btn.disabled=false;};queue.append(el);}}init().catch(e=>gate.textContent=e.message);</script></body></html>
