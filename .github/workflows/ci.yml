name: Red Planet CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, nextjs-portal-migration]

permissions:
  contents: read

concurrency:
  group: red-planet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install, audit, lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
